# Prediction-guided move selection spike (#106), eval-only on the home
# runner. No training, no buffer writes: collect snapshots decisions from
# games played with the champion's own search and value-scores each
# candidate's engine-simulated successor; h2h plays a re-ranking agent
# against the plain search agent. Manual dispatch only.
name: Rerank spike (#106)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "collect (snapshots) or h2h (rerank vs plain)"
        required: true
        default: "collect"
        type: string
      run_name:
        description: "Champion run dir under ~/manamind-runs"
        required: true
        default: "selfplay_rg2614_cd96"
        type: string
      checkpoint:
        description: "Checkpoint path under ~/manamind-runs/<run_name>"
        required: true
        default: "rounds/0001/last.pt"
        type: string
      games:
        description: "Games this dispatch"
        required: true
        default: "200"
        type: string
      sims:
        description: "Search simulations per decision"
        required: true
        default: "32"
        type: string
      top_k:
        description: "Candidates kept per decision"
        required: true
        default: "8"
        type: string
      weights:
        description: "network or ema"
        required: true
        default: "network"
        type: string
      search:
        description: "puct or gumbel"
        required: true
        default: "puct"
        type: string
      seed:
        description: "Base seed"
        required: true
        default: "20261110"
        type: string

permissions:
  contents: read

concurrency:
  group: home-pc-spike-rerank
  cancel-in-progress: false

jobs:
  spike:
    runs-on: [self-hosted, linux, manamind-train]
    timeout-minutes: 600
    env:
      MODE: ${{ github.event.inputs.mode }}
      RUN_NAME: ${{ github.event.inputs.run_name }}
      CKPT_REL: ${{ github.event.inputs.checkpoint }}
      GAMES: ${{ github.event.inputs.games }}
      SIMS: ${{ github.event.inputs.sims }}
      TOP_K: ${{ github.event.inputs.top_k }}
      WEIGHTS: ${{ github.event.inputs.weights }}
      SEARCH: ${{ github.event.inputs.search }}
      SEED: ${{ github.event.inputs.seed }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate inputs
        run: |
          [ "$MODE" = "collect" ] || [ "$MODE" = "h2h" ] || { echo "bad mode"; exit 1; }
          [[ "$RUN_NAME" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "bad run_name"; exit 1; }
          [[ "$CKPT_REL" =~ ^[A-Za-z0-9._/-]+$ && "$CKPT_REL" != *..* ]] || { echo "bad checkpoint"; exit 1; }
          [[ "$GAMES" =~ ^[0-9]+$ && "$GAMES" -gt 0 ]] || { echo "bad games"; exit 1; }
          [[ "$SIMS" =~ ^[0-9]+$ && "$SIMS" -gt 0 ]] || { echo "bad sims"; exit 1; }
          [[ "$TOP_K" =~ ^[0-9]+$ && "$TOP_K" -gt 1 ]] || { echo "bad top_k"; exit 1; }
          [ "$WEIGHTS" = "network" ] || [ "$WEIGHTS" = "ema" ] || { echo "bad weights"; exit 1; }
          [ "$SEARCH" = "puct" ] || [ "$SEARCH" = "gumbel" ] || { echo "bad search"; exit 1; }
          CKPT="$HOME/manamind-runs/$RUN_NAME/$CKPT_REL"
          [ -f "$CKPT" ] || { echo "no checkpoint $CKPT"; exit 1; }
          echo "CKPT=$CKPT" >> "$GITHUB_ENV"

      - name: Python environment (one cached venv per runner instance)
        run: |
          VENV="$HOME/manamind-venv-${RUNNER_NAME// /_}"
          [ -x "$VENV/bin/python" ] || python3 -m venv "$VENV"
          "$VENV/bin/pip" install -q --upgrade pip
          "$VENV/bin/pip" install -q torch --index-url https://download.pytorch.org/whl/cpu
          "$VENV/bin/pip" install -q -e .
          echo "$VENV/bin" >> "$GITHUB_PATH"

      - name: Run spike (${{ github.event.inputs.mode }})
        shell: bash
        run: |
          set -o pipefail
          mkdir -p results
          OUT="results/rerank_${MODE}.jsonl"
          if [ "$MODE" = "collect" ]; then
            PYTHONPATH=src python scripts/prediction_rerank_spike.py collect \
              --checkpoint "$CKPT" --weights "$WEIGHTS" \
              --games "$GAMES" --sims "$SIMS" --top-k "$TOP_K" \
              --search "$SEARCH" --seed "$SEED" --out "$OUT" 2>&1 \
              | grep -v '^\(DEBUG\|INFO\)' | tail -n 2000
          else
            OUT="results/rerank_h2h.json"
            PYTHONPATH=src python scripts/prediction_rerank_spike.py h2h \
              --checkpoint "$CKPT" --weights "$WEIGHTS" \
              --games "$GAMES" --sims "$SIMS" --top-k "$TOP_K" \
              --search "$SEARCH" --seed "$SEED" --out "$OUT" 2>&1 \
              | grep -v '^\(DEBUG\|INFO\)' | tail -n 2000
          fi
          [ -s "$OUT" ] || { echo "no output at $OUT"; exit 1; }

      - name: Analyze snapshots
        if: env.MODE == 'collect'
        shell: bash
        run: |
          PYTHONPATH=src python scripts/prediction_rerank_spike.py analyze \
            --snapshots results/rerank_collect.jsonl \
            --out results/rerank_analysis.json
          cat results/rerank_analysis.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rerank-spike-results
          path: results/
          if-no-files-found: warn
