# manamind#106 prediction-rerank spike, stage 1 (collect + analyze).
#
# Plays self-play games with the champion on the planar-nexus engine
# (selfplay-forge.ts --probe collect): every net decision records the
# search's per-candidate value-head reads (visits, mean leaf value over
# the dealt worlds) and the search's own pick. Then prediction_rerank_spike.py
# scores the value-head re-rank signal (override rate, regret, by seat,
# mover return on override vs agree). Eval-only: no training, no
# champion changes; go/no-go lives on issue #96.

name: Rerank spike (#106)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "collect (plays probe games, then analyzes)"
        required: true
        type: string
      run_name:
        description: "Champion run dir under ~/manamind-runs"
        required: true
        type: string
      ckpt_rel:
        description: "Checkpoint path under the run dir"
        required: false
        type: string
        default: "rounds/0001/last.pt"
      games:
        description: "Probe games"
        required: false
        type: string
        default: "200"
      sims:
        description: "Search simulations per decision"
        required: false
        type: string
        default: "32"
      top_k:
        description: "Top-k candidates for the re-rank analysis"
        required: false
        type: string
        default: "8"
      seed:
        description: "First game seed"
        required: false
        type: string
        default: "20261110"
      c_scale:
        description: "Self-play cScale (champion recipe 0.5)"
        required: false
        type: string
        default: "0.5"
      pn_ref:
        description: "planar-nexus ref carrying the probe code"
        required: false
        type: string
        default: "main"

jobs:
  spike:
    runs-on: [self-hosted, linux, manamind-train]
    timeout-minutes: 360
    env:
      MODE: ${{ inputs.mode }}
      RUN_NAME: ${{ inputs.run_name }}
      CKPT_REL: ${{ inputs.ckpt_rel }}
      GAMES: ${{ inputs.games }}
      SIMS: ${{ inputs.sims }}
      TOP_K: ${{ inputs.top_k }}
      SEED: ${{ inputs.seed }}
      CSCALE: ${{ inputs.c_scale }}
      PN_REF: ${{ inputs.pn_ref }}
    steps:
      - name: Validate inputs
        run: |
          [ "$MODE" = "collect" ] || { echo "mode must be collect"; exit 1; }
          [[ "$RUN_NAME" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "bad run_name"; exit 1; }
          [[ "$CKPT_REL" =~ ^[A-Za-z0-9._/-]+$ && "$CKPT_REL" != *..* ]] || { echo "bad ckpt_rel"; exit 1; }
          [[ "$GAMES" =~ ^[0-9]+$ && "$GAMES" -gt 0 ]] || { echo "bad games"; exit 1; }
          [[ "$SIMS" =~ ^[0-9]+$ && "$SIMS" -gt 0 ]] || { echo "bad sims"; exit 1; }
          [[ "$TOP_K" =~ ^[0-9]+$ && "$TOP_K" -gt 0 ]] || { echo "bad top_k"; exit 1; }
          [[ "$SEED" =~ ^[0-9]+$ ]] || { echo "bad seed"; exit 1; }
          [[ "$CSCALE" =~ ^[0-9.]+$ ]] || { echo "bad c_scale"; exit 1; }
          [[ "$PN_REF" =~ ^[A-Za-z0-9._/-]+$ && "$PN_REF" != *..* ]] || { echo "bad pn_ref"; exit 1; }

      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: anchapin/planar-nexus
          ref: ${{ inputs.pn_ref }}
          path: pn

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pn/package-lock.json

      - name: Planar Nexus dependencies
        working-directory: pn
        run: npm ci --no-audit --no-fund

      - name: Planar Nexus card-script index
        working-directory: pn
        run: npx tsx scripts/build-card-script-index.ts

      - name: Python environment (one cached venv per runner instance)
        run: |
          VENV="$HOME/manamind-venv-${RUNNER_NAME// /_}"
          [ -x "$VENV/bin/python" ] || python3 -m venv "$VENV"
          "$VENV/bin/pip" install -q --upgrade pip
          "$VENV/bin/pip" install -q torch --index-url https://download.pytorch.org/whl/cpu
          "$VENV/bin/pip" install -q -e . onnx onnxruntime
          echo "$VENV/bin" >> "$GITHUB_PATH"

      - name: Resolve champion ONNX (export if the ladder did not)
        run: |
          RUN_DIR="$HOME/manamind-runs/$RUN_NAME"
          CKPT="$RUN_DIR/$CKPT_REL"
          [ -f "$CKPT" ] || { echo "no $CKPT"; exit 1; }
          ONNX="${CKPT%.pt}.onnx"
          if [ ! -f "$ONNX" ]; then
            echo "exporting $CKPT"
            PYTHONPATH=src python -c "import sys; from pathlib import Path; from manamind.models.forge_pointer import load_pointer_net; from manamind.models.forge_pointer_onnx import export; net, _ = load_pointer_net(sys.argv[1]); export(net, Path(sys.argv[2]))" "$CKPT" results/spike_onnx
            ONNX="results/spike_onnx/forge_pointer.onnx"
          fi
          echo "ONNX=$ONNX" >> "$GITHUB_ENV"

      - name: Collect probe games
        working-directory: pn
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/results"
          npx tsx scripts/selfplay-forge.ts \
            --model "$GITHUB_WORKSPACE/$ONNX" \
            --games "$GAMES" --seed "$SEED" --sims "$SIMS" \
            --pick gumbel --c-scale "$CSCALE" \
            --deck-a red --deck-b green \
            --probe collect \
            --out "$GITHUB_WORKSPACE/results/rerank_collect.jsonl.gz" \
            2>&1 | tail -n 100

      - name: Analyze re-rank signal
        run: |
          PYTHONPATH=src python scripts/prediction_rerank_spike.py \
            --in results/rerank_collect.jsonl.gz \
            --out results/rerank_analysis.json \
            --top-k "$TOP_K"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rerank-spike-results-${{ inputs.run_name }}
          path: results/
