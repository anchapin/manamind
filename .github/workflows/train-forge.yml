# Trains the real-card ForgePointerNet (#76) against Forge AI on Alex's own
# Linux PC (self-hosted runner labelled "manamind-train"). Manual dispatch
# only, so nothing here runs on pushes or pull requests.
# Forge 2.0.15 and a JDK 17 are downloaded once into $HOME and reused.
name: Train vs Forge on home PC

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or commit to train"
        required: true
        default: "main"
      run_name:
        description: "Run name (last.pt + log.jsonl under ~/manamind-runs/<run_name>)"
        required: true
        default: "forge_seed0"
      args:
        description: "Extra args for manamind.training.train_forge"
        required: true
        default: "--games 2000 --update-every 8 --seed 0"

permissions:
  contents: read

concurrency:
  group: home-pc-${{ github.event.inputs.run_name }}
  cancel-in-progress: false

jobs:
  train:
    runs-on: [self-hosted, linux, manamind-train]
    timeout-minutes: 1440
    env:
      RUN_NAME: ${{ github.event.inputs.run_name }}
      TRAIN_ARGS: ${{ github.event.inputs.args }}
      FORGE_VERSION: "2.0.15"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Validate inputs
        run: |
          [[ "$RUN_NAME" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "bad run_name"; exit 1; }
          [[ "$TRAIN_ARGS" =~ ^[A-Za-z0-9.,=/_\ -]+$ ]] || { echo "bad args"; exit 1; }

      - name: Python environment (one cached venv per runner instance)
        run: |
          VENV="$HOME/manamind-venv-${RUNNER_NAME// /_}"
          [ -x "$VENV/bin/python" ] || python3 -m venv "$VENV"
          "$VENV/bin/pip" install -q --upgrade pip
          "$VENV/bin/pip" install -q torch --index-url https://download.pytorch.org/whl/cpu
          "$VENV/bin/pip" install -q -e .
          echo "$VENV/bin" >> "$GITHUB_PATH"

      - name: Forge + JDK 17 (cached in $HOME)
        shell: bash
        run: |
          set -euo pipefail
          FORGE_DIR="$HOME/forge-$FORGE_VERSION"
          if ! ls "$FORGE_DIR"/forge-gui-desktop-*-jar-with-dependencies.jar >/dev/null 2>&1; then
            mkdir -p "$FORGE_DIR"
            curl -fsSL -o /tmp/forge.tar.bz2 \
              "https://github.com/Card-Forge/forge/releases/download/forge-$FORGE_VERSION/forge-installer-$FORGE_VERSION.tar.bz2"
            python3 -c "import tarfile,sys; tarfile.open('/tmp/forge.tar.bz2').extractall(sys.argv[1])" "$FORGE_DIR"
            rm -f /tmp/forge.tar.bz2
            JAR="$(find "$FORGE_DIR" -name 'forge-gui-desktop-*-jar-with-dependencies.jar' | head -1)"
            SUB="$(dirname "$JAR")"
            if [ "$SUB" != "$FORGE_DIR" ]; then
              shopt -s dotglob; mv "$SUB"/* "$FORGE_DIR"/
            fi
          fi
          mkdir -p "$FORGE_DIR/home/.forge"
          JAVA_BIN=""
          if command -v java >/dev/null; then
            V="$(java -XshowSettings:properties -version 2>&1 | awk -F'= ' '/java.specification.version/{print $2}')"
            [ "${V%%.*}" -ge 17 ] 2>/dev/null && JAVA_BIN="$(dirname "$(readlink -f "$(command -v java)")")"
          fi
          if [ -z "$JAVA_BIN" ]; then
            JDK="$HOME/forge-jdk17"
            if [ ! -x "$JDK/bin/java" ]; then
              mkdir -p "$JDK"
              curl -fsSL -o /tmp/jdk.tgz \
                "https://api.adoptium.net/v3/binary/latest/17/ga/linux/x64/jdk/hotspot/normal/eclipse"
              tar -xzf /tmp/jdk.tgz -C "$JDK" --strip-components=1
              rm -f /tmp/jdk.tgz
            fi
            JAVA_BIN="$JDK/bin"
          fi
          "$JAVA_BIN/java" -version
          echo "FORGE_DIR=$FORGE_DIR" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$(dirname "$JAVA_BIN")" >> "$GITHUB_ENV"

      - name: Build bridge
        run: tools/forge-bridge/build.sh

      - name: Train (resumes from last.pt if this run name has one)
        shell: bash
        run: |
          set -o pipefail
          RUN_DIR="$HOME/manamind-runs/$RUN_NAME"
          mkdir -p "$RUN_DIR" results
          RESUME=()
          [ -f "$RUN_DIR/last.pt" ] && RESUME=(--resume "$RUN_DIR/last.pt")
          read -r -a EXTRA <<< "$TRAIN_ARGS"
          PYTHONPATH=src python -m manamind.training.train_forge "${EXTRA[@]}" \
            --forge-dir "$FORGE_DIR" --java "$JAVA_HOME/bin/java" \
            --deck-a tools/forge-bridge/decks/rg.dck \
            --deck-b tools/forge-bridge/decks/ub.dck \
            --out "$RUN_DIR" "${RESUME[@]}" 2>&1 \
            | grep -v '^\(DEBUG\|INFO\)' | tail -n 2000 > "results/forge_${RUN_NAME}_run.log"
          tail -5 "results/forge_${RUN_NAME}_run.log"

      - name: Collect log
        if: always()
        run: cp "$HOME/manamind-runs/$RUN_NAME/log.jsonl" "results/forge_${RUN_NAME}_log.jsonl" || true

      - name: Upload results (no checkpoints)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forge-results-${{ github.event.inputs.run_name }}
          path: results/forge_${{ github.event.inputs.run_name }}*
