# Manamind #96 green-seat probe: measure the #2614 deck pair's inherent seat
# balance with the Planar Nexus Expert AI playing itself. The candidate side
# alternates decks (red/green within each pair) and seats (on the play by
# pair), so the by-deck split reads expert-as-red vs expert-as-green against
# the same expert opponent, with no model checkpoint involved. Decision rule
# from the green-seat proposal: expert-as-green near parity means the pair is
# balanced and the ladder's green-seat weakness is model-side; expert-as-green
# collapsing the way the model's reads do (0.115-0.155 vs red 0.777-0.800)
# means the seat is matchup-limited and the #2614 pair stays frozen.
name: Expert balance (expert-vs-expert)

on:
  workflow_dispatch:
    inputs:
      pn_ref:
        description: planar-nexus ref
        default: main
      games:
        description: total games (even; half as red, half as green)
        default: "400"
      seed:
        description: first seed
        default: "1"
      issue:
        description: issue to post the readout on (blank or 0 skips)
        default: "96"

permissions:
  contents: read
  issues: write

concurrency:
  group: home-pc-yardstick-expert-balance
  cancel-in-progress: false

jobs:
  measure:
    runs-on: [self-hosted, linux, manamind-train]
    timeout-minutes: 180
    env:
      GAMES: ${{ github.event.inputs.games }}
      SEED: ${{ github.event.inputs.seed }}
      ISSUE: ${{ github.event.inputs.issue }}
      PN_REF: ${{ github.event.inputs.pn_ref }}
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      NODE_OPTIONS: "--max-old-space-size=2048"
    steps:
      - uses: actions/checkout@v4
        with:
          repository: anchapin/planar-nexus
          ref: ${{ github.event.inputs.pn_ref }}
          path: pn

      - name: Validate inputs
        run: |
          [[ "$GAMES" =~ ^[0-9]+$ && "$GAMES" -gt 0 && $((GAMES % 2)) -eq 0 ]] || { echo "bad games (positive even number)"; exit 1; }
          [[ "$SEED" =~ ^[0-9]+$ ]] || { echo "bad seed"; exit 1; }
          [[ -z "$ISSUE" || "$ISSUE" =~ ^[0-9]+$ ]] || { echo "bad issue"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pn/package-lock.json

      - name: Planar Nexus dependencies
        working-directory: pn
        run: npm ci --no-audit --no-fund

      - name: Planar Nexus card-script index
        working-directory: pn
        run: npx tsx scripts/build-card-script-index.ts

      - name: Expert-vs-expert balance read
        shell: bash
        run: |
          set -o pipefail
          OUT="$GITHUB_WORKSPACE/results/expert_balance_${GITHUB_RUN_ID}"
          mkdir -p "$OUT"
          ( cd pn && npx tsx scripts/yardstick-pn.ts \
              --agent expert \
              --games "$GAMES" --seed "$SEED" \
              --out "$OUT/measure.json" ) 2>&1 \
            | grep -v '^\(DEBUG\|INFO\)' | tail -n 300 | tee "$OUT/measure.log"
          [ -f "$OUT/measure.json" ] || { echo "expert balance read produced no result"; exit 1; }
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - name: Build table and post
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os

          out = os.environ.get("OUT", "")
          if not out or not os.path.isdir(out):
              raise SystemExit(0)

          path = os.path.join(out, "measure.json")
          if not os.path.exists(path):
              raise SystemExit(0)
          with open(path) as f:
              r = json.load(f)

          by_deck = r.get("byDeck") or {}

          def row(label, d):
              n = d.get("win", 0) + d.get("loss", 0) + d.get("draw", 0)
              if not n:
                  return None
              s = (d.get("win", 0) + d.get("draw", 0) / 2) / n
              wld = f"{d.get('win', 0)}-{d.get('loss', 0)}-{d.get('draw', 0)}"
              return f"| {label} | {s:.3f} | {wld} / {n} |"

          lines = [
              "**Expert balance (expert-vs-expert)**",
              "",
              f"Planar Nexus Expert AI plays itself on the #2614 pair, decks "
              f"and seats alternating, {r.get('games', '?')} games. No "
              "model checkpoint involved: this measures the pair's own seat "
              "balance. Overall score sits at 0.5 when the pair is balanced.",
              "",
              "| Measure | Score | W-L-D / games |",
              "|---|---:|---:|",
              row("expert overall", r),
              row("expert as red", by_deck.get("red") or {}),
              row("expert as green", by_deck.get("green") or {}),
          ]
          lines = [l for l in lines if l is not None]

          ci = r.get("ci95") or r.get("ci")
          if ci and len(ci) >= 2:
              lines.append(
                  f"Overall Wilson 95% CI: [{ci[0]:.3f}, {ci[1]:.3f}]"
              )
          if r.get("errorCount"):
              lines.append(
                  f"Game errors: {r.get('errorCount')} (first lines in "
                  "<details> below)"
              )
          lines += ["", "<details><summary>Raw results</summary>", ""]
          lines += ["```json", "measure.json", json.dumps(r, indent=2), "```", ""]
          lines += ["</details>", ""]
          lines.append(
              f"_[Run]({os.environ.get('GITHUB_SERVER_URL', '')}/"
              f"{os.environ.get('GITHUB_REPOSITORY', '')}/actions/runs/"
              f"{os.environ.get('GITHUB_RUN_ID', '')}), planar-nexus "
              f"`{os.environ.get('PN_REF', '')}`._"
          )
          with open(os.path.join(out, "comment.md"), "w") as f:
              f.write("\n".join(lines))
          PY
          cat "$OUT/comment.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          ISSUE="${ISSUE:-}"
          if [ -n "$ISSUE" ] && [ "$ISSUE" != "0" ] && [ -f "$OUT/comment.md" ]; then
            gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" \
              --body-file "$OUT/comment.md"
          fi

      - name: Upload results (no checkpoints)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: expert-balance-${{ github.run_id }}
          path: results/expert_balance_*
